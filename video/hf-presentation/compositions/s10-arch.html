        }

      <div id="root" class="fnv-root" data-composition-id="s10-arch" data-width="1920" data-height="1080" data-duration="37.6">

        <!-- ── page A: how it is deployed ── -->
        <div class="a-page" id="a-pageA">
          <div class="a-eyebrow" id="a-eyeA">10 ／ 背後</div>
          <div class="a-h" id="a-hA">線上是這樣接起來的</div>

          <div class="a-box" id="a-b1" style="left: 150px; top: 320px; width: 330px; height: 160px">

          <div class="a-box" id="a-b2" style="left: 614px; top: 320px; width: 340px; height: 160px">
            <div class="a-box-k fnv-mono">VERCEL</div>
            <div class="a-box-t">前端</div>
            <div class="a-box-b">React 靜態檔・/api 同源代理</div>
          </div>
          <div class="a-line" id="a-l2" style="left: 964px; top: 398px; width: 96px; height: 4px"></div>
          <div class="a-head" id="a-h2" style="left: 1060px; top: 392px"></div>

          <div class="a-box a-ink" id="a-b3" style="left: 1088px; top: 320px; width: 380px; height: 160px">
            <div class="a-box-k fnv-mono">RENDER</div>
            <div class="a-box-t">後端 FastAPI</div>
            <div class="a-box-b">判讀流程都在這裡</div>
          </div>

          <div class="a-line a-line-v" id="a-l3" style="left: 1276px; top: 490px; width: 4px; height: 96px"></div>
          <div class="a-head a-head-d" id="a-h3" style="left: 1268px; top: 586px"></div>
          <div class="a-line" id="a-l4" style="left: 878px; top: 604px; width: 400px; height: 4px"></div>

          <div class="a-box" id="a-b4" style="left: 470px; top: 640px; width: 420px; height: 168px">
            <div class="a-box-k fnv-mono">SUPABASE</div>
            <div class="a-box-t">資料庫</div>
            <div class="a-box-b">Postgres ＋ pgvector</div>

            <div class="a-box-t">AI 閘道</div>
            <div class="a-box-b"><span class="fnv-mono">gpt-5.4-mini</span>・學校提供的額度</div>
          </div>
        </div>

        <!-- ── page B: how a message is decided ── -->
        <div class="a-page" id="a-pageB">
          <div class="a-eyebrow" id="a-eyeB">10 ／ 判讀順序</div>
          <div class="a-h" id="a-hB">先找答案，找不到才問 AI</div>

          <div class="a-step" id="a-s1" style="top: 246px">
            <div class="a-step-n fnv-mono">L1</div>
            <div>
              <div class="a-step-h">相同內容</div>
              <div class="a-step-b">雜湊比對，完全一樣就直接沿用</div>
            </div>
          </div>
          <div class="a-step" id="a-s2" style="top: 400px">

            </div>

          <div class="a-guards" id="a-guards">
            <div class="a-guards-h">護欄</div>
            <div class="a-guard" id="a-g1">每天 300 次 AI 上限<span>超過就只回快取，隔天歸零</span></div>
            <div class="a-guard" id="a-g2">每個 IP 的頻率限制<span>每分鐘 30 次、每小時 200 次</span></div>
            <div class="a-guard" id="a-g3">上傳大小限制<span>圖片端點 10 MB 以內</span></div>
          </div>

          <div class="a-live" id="a-live">2026-09-19 起上線運作・不需要任何人開著電腦</div>

      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s10-arch"]');
          const $ = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          // Narration (shot clock): 1.30 瀏覽器→Vercel→Render / 7.46 Supabase＋CGU / 13.32 判讀順序
          //                         21.10 才問 AI / 24.03 護欄 / 29.72 已上線
          const CUE = { chain: 1.3, data: 7.46, order: 13.32, ai: 21.1, guard: 24.03, live: 29.72 };
          const rise = (sel, t, y = 26, d = 0.5) =>
            tl.fromTo($(sel), { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);

          tl.set($("#a-pageB"), { opacity: 0, visibility: "hidden" });
          tl.set([$("#a-l1"), $("#a-l2"), $("#a-l4")], { scaleX: 0 });
          tl.set($("#a-l3"), { scaleY: 0 });
          tl.set([$("#a-h1"), $("#a-h2"), $("#a-h3"), $("#a-b4"), $("#a-b5")], { opacity: 0 });

          rise("#a-eyeA", 0.3, 10, 0.4);
          rise("#a-hA", CUE.chain - 0.45, 22, 0.55);
          rise("#a-b1", CUE.chain + 0.15);
          tl.to($("#a-l1"), { scaleX: 1, duration: 0.35, ease: "power2.out" }, CUE.chain + 0.7);
          tl.to($("#a-h1"), { opacity: 1, duration: 0.2 }, CUE.chain + 1.0);
          rise("#a-b2", CUE.chain + 1.1);
          tl.to($("#a-l2"), { scaleX: 1, duration: 0.35, ease: "power2.out" }, CUE.chain + 2.1);
          tl.to($("#a-h2"), { opacity: 1, duration: 0.2 }, CUE.chain + 2.4);
          rise("#a-b3", CUE.chain + 2.5);

          tl.to($("#a-l3"), { scaleY: 1, duration: 0.35, ease: "power2.out" }, CUE.data - 0.3);
          tl.to($("#a-h3"), { opacity: 1, duration: 0.2 }, CUE.data);
          tl.to($("#a-l4"), { scaleX: 1, duration: 0.45, ease: "power2.out" }, CUE.data + 0.1);
          tl.fromTo($("#a-b4"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CUE.data + 0.55);
          tl.fromTo($("#a-b5"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CUE.data + 2.6);

          // page A hands over to page B
          tl.to($("#a-pageA"), { opacity: 0, y: -60, filter: "blur(9px)", duration: 0.7, ease: "power2.in" }, CUE.order - 1.15);
          tl.set($("#a-pageA"), { visibility: "hidden" }, CUE.order - 0.4);
          tl.set($("#a-pageB"), { visibility: "visible" }, CUE.order - 0.65);
          tl.to($("#a-pageB"), { opacity: 1, duration: 0.5, ease: "none" }, CUE.order - 0.6);

          rise("#a-eyeB", CUE.order - 0.55, 10, 0.4);
          rise("#a-hB", CUE.order - 0.4, 22, 0.55);
          rise("#a-s1", CUE.order + 0.4, 22, 0.45);
          rise("#a-s2", CUE.order + 2.3, 22, 0.45);
          rise("#a-s3", CUE.ai - 0.3, 22, 0.45);
          // the AI step is the expensive one: it inverts to ink when the narration reaches it
          tl.to($("#a-s3"), { backgroundColor: "#111111", boxShadow: "0 0 0 2px #111111", duration: 0.45, ease: "power2.out" }, CUE.ai + 0.5);
          tl.to($("#a-s3"), { attr: { class: "a-step a-ink" }, duration: 0 }, CUE.ai + 0.5);

          rise("#a-guards", CUE.guard - 0.35, 18, 0.45);
          rise("#a-g1", CUE.guard + 0.2, 16, 0.4);
          rise("#a-g2", CUE.guard + 1.6, 16, 0.4);
          rise("#a-g3", CUE.guard + 3.1, 16, 0.4);
          rise("#a-live", CUE.live - 0.35, 24, 0.55);

          window.__timelines["s10-arch"] = tl;
        })();
      </script>
