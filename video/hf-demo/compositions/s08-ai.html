<!doctype html>
<!--
  s08-ai — 鏡 8「新訊息：AI 即時判讀＋尚無查核機構證實」 (21.5s)
  Genuine capture S8_t1 (local run, AI_PROVIDER=cgu, gpt-5.4-mini): paste the new message N3 → 開始查證 →
  loading 9.8 s (×3, labelled) → 假訊息 + chip 「AI 即時判定」 + banner 「尚無查核機構證實」, empty sources box.
  This is the only time 「尚無查核機構證實」 appears in the film.
  Camera: wide → input → wide (loading) → tight on header + banner → down to the empty sources box → back.
  Blueprint: cursor-ui-demo · rules: viewport-change, multi-phase-camera.
-->
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #f7f7f8;
        }
        .s08-col {
          position: absolute;
          left: 1284px;
          top: 76px;
          width: 540px;
          height: 800px;
        }
        .s08-h {
          margin-top: 8px;
          font-size: 50px;
          line-height: 62px;
          font-weight: 700;
        }
        .s08-miss {
          justify-self: end;
          font-size: 22px;
          font-weight: 700;
          color: #5b5b66;
        }
        .s08-ladder .fnv-step {
          grid-template-columns: 60px 1fr auto;
        }
        .s08-engine {
          display: block;
          font-size: 21px;
          line-height: 30px;
          font-weight: 400;
          color: inherit;
        }
        .s08-l3 {
          min-height: 96px;
        }
        .s08-note {
          margin-top: 20px;
          padding: 20px 26px 24px;
          border-radius: 16px;
          background: #ffffff;
          box-shadow: 0 0 0 2px #d4d4d8;
        }
        .s08-note-h {
          margin-top: 6px;
          font-size: 32px;
          line-height: 44px;
          font-weight: 700;
        }
        .s08-note-b {
          margin-top: 8px;
          font-size: 26px;
          line-height: 38px;
          color: #3f3f46;
        }
        .s08-rule {
          position: static;
          display: inline-block;
          margin-top: 20px;
          font-size: 26px;
          line-height: 36px;
          padding: 10px 24px 12px;
          white-space: normal;
          border-radius: 18px;
        }
      </style>

      <div id="root" class="fnv-root" data-composition-id="s08-ai" data-width="1920" data-height="1080" data-duration="22.1">
        <div class="fnv-grid"></div>

        <div class="fnv-panel" id="s08-panel">
          <div class="fnv-cam" id="s08-cam" data-layout-allow-overflow>
            <video id="s08-footage" src="assets/footage/s08_ai.mp4" data-start="0" data-duration="22.1" data-track-index="0" muted playsinline></video>
            <div class="fnv-ring" id="s08-ring-chip" style="left: 1220px; top: 96px; width: 128px; height: 50px"></div>
            <div class="fnv-ring fnv-ring-box" id="s08-ring-banner" style="left: 570px; top: 220px; width: 780px; height: 125px"></div>
            <div class="fnv-ring fnv-ring-box" id="s08-ring-src" style="left: 570px; top: 910px; width: 780px; height: 100px"></div>
          </div>
        </div>
        <div class="fnv-tag fnv-tag-panel" id="s08-local">本機執行畫面</div>
        <div class="fnv-tag fnv-tag-speed s08-speed" id="s08-speed">畫面加速 ×3</div>

        <div class="s08-col">
          <div class="fnv-eyebrow fnv-mono" id="s08-eyebrow">08 ／ 全新的訊息</div>
          <div class="s08-h" id="s08-h">快取沒有，才問 AI</div>

          <div class="fnv-ladder s08-ladder">
            <div class="fnv-step" id="s08-l1"><span class="fnv-step-n fnv-mono">L1</span><span>相同內容</span><span class="s08-miss" id="s08-m1">未命中</span></div>
            <div class="fnv-step" id="s08-l2"><span class="fnv-step-n fnv-mono">L2</span><span>語意相似</span><span class="s08-miss" id="s08-m2">未命中</span></div>
            <div class="fnv-step s08-l3" id="s08-l3">
              <span class="fnv-step-n fnv-mono">L3</span>
              <span>AI 即時判讀<span class="s08-engine fnv-mono">長庚 CGU AIR・gpt-5.4-mini</span></span>
            </div>
          </div>

          <div class="s08-note" id="s08-note">
            <div class="fnv-eyebrow fnv-mono">找不到已判定的查核來源</div>
            <div class="s08-note-h">頁面明示「尚無查核機構證實」</div>
            <div class="s08-note-b" id="s08-note-b">來源區是空的，請使用者自行查證。</div>
          </div>
          <div class="fnv-tag s08-rule" id="s08-rule">沒有 Tier 1／2 來源 → 明示、不給綠燈</div>
        </div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s08-ai"]');
          const $ = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });

          // Narration offset 2.0: 全新的訊息 2.10 · 快取裡沒有 4.12 · 交給長庚 CGU AIR 5.31 · 找不到來源 8.65 · 明白標示 11.03 · 不假裝 14.10
          const CUE = { fresh: 2.1, miss: 4.12, ai: 5.31, nosrc: 8.65, banner: 11.03, honest: 14.1 };
          // Footage clock: paste 1.83 · click 4.50 · loading ×3 4.56–7.83 · result 7.83
          const F = { paste: 1.83, load0: 4.56, load1: 7.83 };

          const cam = (cx, cy, s) => ({
            x: Math.min(0, Math.max(1140 - 1920 * s, 570 - cx * s)),
            y: Math.min(0, Math.max(800 - 1080 * s, 400 - cy * s)),
            scale: s,
          });
          const WIDE = cam(960, 400, 1);
          const INPUT = cam(960, 420, 1.2);
          const LOAD = cam(960, 236, 1.3); // the loading stepper (檢查快取 → 讀取內容 → AI 判讀)
          const HEAD = cam(960, 0, 1.425); // header + chips + banner
          const SRC = cam(960, 1080, 1.425); // 你查的內容 → 查核來源（空）

          tl.fromTo($("#s08-panel"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          tl.fromTo($("#s08-local"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.6);
          tl.fromTo($("#s08-cam"), WIDE, { ...INPUT, duration: 1.3, ease: "power2.inOut" }, 0.7);
          tl.to($("#s08-cam"), { ...LOAD, duration: 0.9, ease: "power2.inOut" }, F.load0 - 0.1);
          tl.to($("#s08-cam"), { ...HEAD, duration: 1.1, ease: "power2.inOut" }, F.load1 + 0.3);
          tl.to($("#s08-cam"), { ...SRC, duration: 1.3, ease: "power2.inOut" }, CUE.honest - 0.2);
          tl.to($("#s08-cam"), { ...HEAD, duration: 1.2, ease: "power2.inOut" }, 17.8);

          // emphasis rings (capture pixels): lock in, hold, release
          const ring = (sel, at, until) => {
            tl.fromTo($(sel), { opacity: 0, scale: 1.14 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, at);
            tl.to($(sel), { opacity: 0, duration: 0.25, ease: "power1.in" }, until);
          };
          ring("#s08-ring-chip", 9.3, CUE.banner - 0.1); // 「AI 即時判定」
          ring("#s08-ring-banner", CUE.banner + 0.35, CUE.honest - 0.35); // 「尚無查核機構證實」
          ring("#s08-ring-src", CUE.honest + 1.2, 17.6); // the empty sources box

          tl.fromTo($("#s08-speed"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, F.load0);
          tl.to($("#s08-speed"), { opacity: 0, duration: 0.2, ease: "power1.in" }, F.load1);

          tl.fromTo($("#s08-eyebrow"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.3);
          tl.fromTo($("#s08-h"), { opacity: 0, x: 44 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, CUE.fresh - 0.4);
          tl.fromTo([$("#s08-l1"), $("#s08-l2"), $("#s08-l3")], { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.09 }, CUE.fresh + 0.6);

          // 「快取裡沒有」: both cache layers report a miss and step back
          tl.fromTo($("#s08-m1"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, CUE.miss + 0.05);
          tl.fromTo($("#s08-m2"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, CUE.miss + 0.4);
          tl.to($("#s08-l1"), { opacity: 0.5, duration: 0.3, ease: "power1.out" }, CUE.miss + 0.25);
          tl.to($("#s08-l2"), { opacity: 0.5, duration: 0.3, ease: "power1.out" }, CUE.miss + 0.6);
          // 「交給長庚 CGU AIR 的模型」
          tl.to($("#s08-l3"), { backgroundColor: "#111111", color: "#ffffff", boxShadow: "0 0 0 2px #111111", duration: 0.3, ease: "power2.out" }, CUE.ai + 0.2);
          tl.to($("#s08-l3"), { scale: 1.04, duration: 0.2, ease: "power2.out" }, CUE.ai + 0.2);
          tl.to($("#s08-l3"), { scale: 1, duration: 0.35, ease: "power2.inOut" }, CUE.ai + 0.4);

          tl.fromTo($("#s08-note"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CUE.nosrc + 0.2);
          tl.fromTo($("#s08-note-b"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, CUE.honest + 0.9);
          tl.fromTo($("#s08-rule"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 16.5);

          window.__timelines["s08-ai"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
