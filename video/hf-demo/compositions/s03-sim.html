          tl.fromTo($("#s03-eyebrow"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.35);
          tl.fromTo($("#s03-p1"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
          tl.fromTo($("#s03-p2"), { opacity: 0, y: 56 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.45);
          tl.fromTo($$(".s03-pre"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none", stagger: 0.05 }, 0.8);
          // the narrator names the mode: the tag answers once
          tl.to($("#s03-simtag"), { scale: 1.06, duration: 0.22, ease: "power2.out" }, S3.sim + 0.5);
          tl.to($("#s03-simtag"), { scale: 1, duration: 0.4, ease: "power2.inOut" }, S3.sim + 0.72);

          // ── A: who tagged whom ────────────────────────────────────────────────
          tl.fromTo($("#s03-hl-p100"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, S3.mention);
          tl.fromTo($("#s03-drawer"), { y: 290 }, { y: 0, duration: 0.55, ease: "power3.out" }, S3.mention - 0.15);
          tl.to($$(".s03-under"), { opacity: 0, duration: 0.3, ease: "none" }, S3.mention - 0.15);
          tl.fromTo($("#s03-call-a"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, S3.mention + 0.2);
          tl.fromTo($("#s03-hl-m1"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, S3.mention + 1.15);
          tl.fromTo($("#s03-call-b"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, S3.mention + 1.35);

          // ── A: the poll command types itself, then the real output prints ────
          const CMD = ".\\venv\\Scripts\\python scripts\\test_threads_bot.py --poll";
          const TYPE0 = S3.poll + 0.15;
          const TYPE1 = TYPE0 + 2.0;
          const ENTER = TYPE1 + 0.25;
          const typed = $("#s03-typed");
          const caret = $("#s03-caret");
          const wait = $("#s03-wait");
          tl.fromTo($("#s03-cmd"), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, S3.poll - 0.35);
          const drv = { t: 0 };
          tl.to(
            drv,
            {
              t: DUR,
              duration: DUR,
              ease: "none",
              onUpdate: () => {
                const t = drv.t;
                const p = Math.min(1, Math.max(0, (t - TYPE0) / (TYPE1 - TYPE0)));
                typed.textContent = CMD.substring(0, Math.round(p * CMD.length));
                // block caret: solid while typing, square-wave blink while waiting, gone once output completes
                // block caret: blinks at the prompt, solid while typing, then waits under the output while the poll runs
                const blink = Math.sin(t * Math.PI * 2 * 1.1) > 0 ? "1" : "0";
                caret.style.opacity = t < TYPE0 ? blink : t <= ENTER ? "1" : "0";
                wait.style.opacity = t > ENTER + 0.9 && t < ENTER + 2.9 ? blink : "0";
              },
            },
            0,
          );
          // real run: 01:24:19.3 → 01:24:22.5 (3.2 s); replay keeps the same order and roughly the same wait
          const po = $$(".s03-po");
          const poAt = [ENTER + 0.3, ENTER + 0.85, ENTER + 2.9, ENTER + 3.2, ENTER + 3.26, ENTER + 3.5, ENTER + 3.7, ENTER + 3.9];
          po.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, poAt[i]));

          // ── B: mentions.json leaves, terminal moves over, the log line is unpacked ──
          tl.to($("#s03-p1"), { x: -900, opacity: 0, duration: 0.7, ease: "power3.inOut" }, B);
          tl.to($("#s03-p2"), { x: -732, duration: 0.7, ease: "power3.inOut" }, B);
          tl.fromTo($("#s03-flow"), { x: 820, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.inOut" }, B);
          tl.to($$(".s03-tl:not(.s03-log)"), { opacity: 0.34, duration: 0.5, ease: "power1.out" }, B + 0.3);
          tl.fromTo($("#s03-log-hl"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, B + 0.35);

          const steps = ["#s03-st1", "#s03-st2", "#s03-st3", "#s03-st4", "#s03-st5"].map($);
          const stepAt = [B + 0.55, B + 0.8, S4.kb + 0.45, S4.judged + 0.1, S4.hit + 1.55];
          steps.forEach((el, i) => tl.fromTo(el, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, stepAt[i]));
          const ink = { backgroundColor: "#111111", color: "#ffffff", boxShadow: "0 0 0 2px #111111", duration: 0.3, ease: "power2.out" };
          tl.to(steps[3], ink, S4.judged + 0.75); // 「查核機構已經判定過」
          tl.to(steps[2], ink, S4.hit + 0.1); // 「直接命中快取」
          tl.to(steps[2], { scale: 1.035, duration: 0.2, ease: "power2.out" }, S4.hit + 0.1);
          tl.to(steps[2], { scale: 1, duration: 0.35, ease: "power2.inOut" }, S4.hit + 0.3);

          // ── C: the reply itself ───────────────────────────────────────────────
          tl.to($("#s03-p2"), { x: -1900, opacity: 0, duration: 0.7, ease: "power3.inOut" }, C);
          tl.to($("#s03-flow"), { x: -1300, opacity: 0, duration: 0.7, ease: "power3.inOut" }, C);
          tl.fromTo($("#s03-p3"), { x: 1000, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.inOut" }, C);
          tl.fromTo($("#s03-reply"), { x: 1200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.inOut" }, C + 0.06);

          const rAt = { r1: S4.light - 0.05, r2: S4.light + 0.75, r3: S4.source - 0.05, r4: S4.source + 1.35, r5: S4.source + 1.85 };
          for (const [id, at] of Object.entries(rAt)) {
            tl.fromTo($("#s03-" + id), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at);
            tl.fromTo($("#s03-v" + id.slice(1)), { opacity: 0.25 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, at);
          }
          tl.fromTo($("#s03-r1-mark"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, S4.light + 0.2);
          tl.fromTo($("#s03-r1-pill"), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, S4.light + 0.4); // binary arrival
          tl.fromTo($("#s03-r1-pill"), { scale: 0.6 }, { scale: 1, duration: 0.4, ease: "back.out(1.8)" }, S4.light + 0.4);
          tl.fromTo($("#s03-r3-mark"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, S4.source + 0.35);
          tl.fromTo($("#s03-r3-pill"), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, S4.source + 0.9); // binary arrival
          tl.fromTo($("#s03-r3-pill"), { scale: 0.6 }, { scale: 1, duration: 0.4, ease: "back.out(1.8)" }, S4.source + 0.9);
          // bridge to the next scene: the link inside the reply is what gets opened
          tl.fromTo($("#s03-r4-mark"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 26.6);
          tl.to($("#s03-r1-mark"), { opacity: 0, duration: 0.4, ease: "none" }, 26.6);
          tl.to($("#s03-r3-mark"), { opacity: 0, duration: 0.4, ease: "none" }, 26.6);

          window.__timelines["s03-sim"] = tl;
        })();
      </script>
    </template>
  </body>
