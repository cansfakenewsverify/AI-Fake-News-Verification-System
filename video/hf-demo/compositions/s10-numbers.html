      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s10-numbers"]');
          const $ = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });

          // Narration offset 0.8: 前一版…96% 0.90 · 沒有…判成安全 4.81 · 新模型重跑…全部判對 7.58 · CI 11.90
          const CUE = { old: 0.9, fn: 4.81, neu: 7.58, ci: 11.9, data: 15.0 };

          // a value stays hidden until its beat, then counts to the exact figure
          const count = (el, to, at, dur, fmt, from = 0) => {
            const p = { v: from };
            const box = el.closest(".s10-kv-v") || el; // reveal the unit together with its number
            tl.fromTo(box, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, at);
            tl.to(p, { v: to, duration: dur, ease: "power2.out", onUpdate: () => (el.textContent = fmt(p.v)) }, at);
          };

          tl.fromTo($("#s10-h"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, 0.2);
          tl.fromTo($("#s10-eyebrow"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.4);
          tl.fromTo($("#s10-r1"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.35);
          // rows 2 and 3 are present but quiet until their beat
          tl.fromTo($("#s10-r2"), { opacity: 0, y: 40 }, { opacity: 0.3, y: 0, duration: 0.6, ease: "power3.out" }, 0.5);
          tl.fromTo($("#s10-r3"), { opacity: 0, y: 40 }, { opacity: 0.3, y: 0, duration: 0.6, ease: "power3.out" }, 0.65);

          // 1 · previous model
          tl.fromTo($("#s10-m2"), { opacity: 0.25 }, { opacity: 0.25, duration: 0.01 }, 0);
          count($("#s10-a1"), 96.0, CUE.old + 1.6, 1.1, (v) => v.toFixed(1) + "%");
          tl.fromTo($("#s10-a1"), { scale: 0.86 }, { scale: 1, duration: 1.1, ease: "power2.out" }, CUE.old + 1.6);
          tl.fromTo($("#s10-k1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUE.fn);
          tl.fromTo($("#s10-fn1"), { scale: 1 }, { scale: 1.12, duration: 0.2, ease: "power2.out" }, CUE.fn + 1.0);
          tl.to($("#s10-fn1"), { scale: 1, duration: 0.35, ease: "power2.inOut" }, CUE.fn + 1.2);

          // 1 · new model, same 150 items
          tl.to($("#s10-m2"), { opacity: 1, duration: 0.4, ease: "power1.out" }, CUE.neu);
          count($("#s10-a2"), 100, CUE.neu + 1.5, 1.1, (v) => Math.round(v) + "%");
          tl.fromTo($("#s10-a2"), { scale: 0.86 }, { scale: 1, duration: 1.1, ease: "power2.out" }, CUE.neu + 1.5);
          tl.fromTo($("#s10-k2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUE.neu + 2.7);

          // 2 · tests
          tl.to($("#s10-r2"), { opacity: 1, duration: 0.4, ease: "power1.out" }, CUE.ci - 0.2);
          count($("#s10-t1"), 478, CUE.ci, 1.0, (v) => String(Math.round(v)));
          count($("#s10-t2"), 375, CUE.ci + 0.25, 1.0, (v) => String(Math.round(v)));
          tl.fromTo($("#s10-aside2"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, CUE.ci + 1.2);

          // 3 · data quality (no narration: the numbers speak)
          tl.to($("#s10-r3"), { opacity: 1, duration: 0.4, ease: "power1.out" }, CUE.data);
          count($("#s10-d1"), 0, CUE.data + 0.15, 1.1, (v) => String(Math.round(v)), 31);
          count($("#s10-d2"), 128, CUE.data + 0.9, 1.0, (v) => String(Math.round(v)));
          tl.fromTo($("#s10-aside3"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, CUE.data + 2.0);

          window.__timelines["s10-numbers"] = tl;
        })();
