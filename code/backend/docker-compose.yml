version: '3.8'

# 目前架構：SQLite + Parquet（免資料庫服務），只需要 backend 一個容器。
# 前端 React 開發時走 vite proxy；正式部署可自行加 nginx 反代 /api → backend:8000。
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: factcheck_backend
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - MYAI_API_KEY=${MYAI_API_KEY}
      - CGU_API_KEY=${CGU_API_KEY:-}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DEMO_MODE=${DEMO_MODE:-false}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-false}
      - USE_WEB_SEARCH=${USE_WEB_SEARCH:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - backend_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  backend_data:
