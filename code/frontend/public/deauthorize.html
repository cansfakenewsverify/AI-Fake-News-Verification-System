<title>取消授權</title>
<style>
:root{--c-bg:#FFFFFF;--c-surface:#F7F7F8;--c-ink:#111111;--c-ink-2:#4B5563;--c-ink-3:#6B7280;--c-line:#E5E7EB;--c-accent:#111111}

footer{max-width:640px;margin:0 auto;padding:16px 16px 32px;border-top:1px solid var(--c-line);color:var(--c-ink-2);font-size:14px;line-height:20px}
