# 信心程度驗證與模型比較（docs/test/信心程度驗證計畫.md、docs/test/模型比較計畫.md）的批次。
# 雲端 session 沒有金鑰、也連不到 CGU 與查核網站，所以要連網或呼叫 CGU 的步驟都在 GitHub 的機器上跑（AGENTS.md 第 2 節）；
# 不在 Render 跑（那是正式站）。
#
# - 訊息原文（語料、題目、向量）只存在 actions/cache（只有本 repo 這個分支的 workflow 讀得到，不公開下載），不進 git。
#   cache 7 天沒用會被 GitHub 清掉：清掉後 corpus-fetch 免費重抓，但向量要重算（花 embedding 額度）。
# - 結果（報告、逐題 CSV、docs/test/results/research_status.json；只有網址、雜湊、判定與數字）commit 回觸發的分支。
# - 花錢的步驟（embed 的 OpenAI 模型、benchmark-run 的 OpenAI 模型）照 AGENTS.md 第 4 節：
#   開始前與每 100 題讀 /me/usage、保留 USD 3 給網站使用者、本次上限 max_usd；trial（預設打勾）只跑 50 題並估全部的花費；
#   台灣時間週日不跑（週日 21:17 有每週評測）。額度週四重置，重置後再跑。
# - 不在 main 上跑：觸發時「Use workflow from」選研究分支。
#
# 順序：corpus-fetch → embed（text-embedding-3-small 先試跑、再全部）→ confidence-analyze
#       benchmark-freeze（要 small 向量）→ benchmark-run（每個模型先試跑）→ benchmark-report
name: research

on:
  workflow_dispatch:
    inputs:
      task:
        description: "要跑哪一步"
        type: choice
        options: [corpus-fetch, embed, confidence-analyze, benchmark-freeze, benchmark-run, benchmark-report]
        default: corpus-fetch
      embed_model:
        description: "embed：embedding 模型"
        type: choice
        options: [text-embedding-3-small, text-embedding-3-large, "bge-m3:latest"]
        default: text-embedding-3-small
      model:
        description: "benchmark-run：模型（例如 gpt-5.6-luna、gpt-6-luna、gpt-oss-120b、gemma-4-26b-a4b-it、gpt-oss:20b）"
        default: gpt-5.6-luna
      effort:
        description: "benchmark-run：推理強度（none = 不帶；chat 模型不支援推理強度時選 none）"
        type: choice
        options: [medium, high, low, minimal, none]
        default: medium
      api:
        description: "benchmark-run：閘道的 OpenAI 模型用 responses；本地與算力池模型用 chat"
        type: choice
        options: [responses, chat]
        default: responses
      trial:
        description: "試跑：只做 50 題（筆）並估全部的花費"
        type: boolean
        default: true
      max_usd:
        description: "本次最多花多少 USD（另外一律保留 USD 3 給網站使用者）"
        default: "1"

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: code/backend
    env:
      CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
      STORAGE_BACKEND: local
      PYTHONIOENCODING: utf-8
      TASK: ${{ inputs.task }}
      EMBED_MODEL: ${{ inputs.embed_model }}
      MODEL: ${{ inputs.model }}
      EFFORT: ${{ inputs.effort }}
      API: ${{ inputs.api }}
      TRIAL: ${{ inputs.trial && 'true' || 'false' }}
      MAX_USD: ${{ inputs.max_usd }}
    steps:
      - name: Refuse to run on main
        if: github.ref_name == 'main'
        working-directory: .
        run: |
          echo "::error::Pick the research branch under 'Use workflow from' (results are committed to the branch the run uses)."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore research data (raw responses, corpus, vectors; never committed)
        uses: actions/cache/restore@v4
        with:
          path: code/backend/data/research
          key: research-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: research-v1-

      - name: Run ${{ inputs.task }}
        run: |
          mkdir -p data/research
          limit=""
          if [ "$TRIAL" = "true" ]; then limit="--limit 50"; fi
          case "$TASK" in
            corpus-fetch)       python scripts/confidence_validation.py fetch ;;
            embed)              python scripts/confidence_validation.py embed --model "$EMBED_MODEL" $limit --max-usd "$MAX_USD" ;;
            confidence-analyze) python scripts/confidence_validation.py analyze ;;
            benchmark-freeze)   python scripts/model_benchmark.py freeze ;;
            benchmark-run)      python scripts/model_benchmark.py run --model "$MODEL" --effort "$EFFORT" --api "$API" $limit --max-usd "$MAX_USD" ;;
            benchmark-report)   python scripts/model_benchmark.py report ;;
            *) echo "::error::unknown task $TASK"; exit 1 ;;
          esac

      - name: Save research data
        if: always() && (inputs.task == 'corpus-fetch' || inputs.task == 'embed')
        uses: actions/cache/save@v4
        with:
          path: code/backend/data/research
          key: research-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit results to this branch (no message text)
        if: always() && github.ref_name != 'main'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test/results/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "研究批次 ${TASK}（research workflow 自動產生）"
          for attempt in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::Could not push the results."
          exit 1
