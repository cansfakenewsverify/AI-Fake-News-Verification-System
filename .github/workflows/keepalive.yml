# 保持雲端後端與資料庫清醒（說明見 docs/rebuild/runbook_cloud_deploy.md Part C）：
# - Render 免費方案 15 分鐘沒有流量就休眠，喚醒約需 1 分鐘 → 每 10 分鐘打一次 /health。
# - Supabase 免費專案約 7 天沒有資料庫活動會被暫停 → 每輪打一次 /api/knowledge/stats（會讀資料庫）。
# 後端網址取自 repository variable BACKEND_BASE_URL（不是 secret；沒設定時本 workflow 直接結束）。
# 不需要任何金鑰；失敗只印狀態碼，不讓 workflow 變紅（休眠中的免費主機第一次常逾時）。
# 注意：GitHub 排程在尖峰時段可能延遲或漏跑；公開 repo 連續 60 天沒有活動，排程會被自動停用。
name: keepalive

on:
  schedule:
    # 每 10 分鐘（第 3、13、23...分；避開整點的 GitHub 排程尖峰）。cron 為 UTC。
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

# 不 checkout、不碰 repo：GITHUB_TOKEN 權限全關
permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
    steps:
      - name: Ping backend
        run: |
          base="${BACKEND_BASE_URL%/}"
          if [ -z "$base" ]; then
            echo "Repository variable BACKEND_BASE_URL is not set -- nothing to ping."
            echo "Set it with: gh variable set BACKEND_BASE_URL --body https://<name>.onrender.com"
            exit 0
          fi
          case "$base" in
            http://*|https://*) ;;
            *)
              echo "BACKEND_BASE_URL must start with https:// -- skipping."
              exit 0
              ;;
          esac

          # Prints "<http_code> <seconds>"; http_code 000 = timeout / connection failure.
          # "|| true": bash runs with -e here, a curl failure must never fail the job.
          probe() {
            curl -sS -o /dev/null -w "%{http_code} %{time_total}" --max-time 60 "$1" 2>/dev/null || true
          }

          # 1) /health wakes the instance (no database, no AI call).
          #    A sleeping free instance needs about a minute, so retry once.
          for attempt in 1 2; do
            set -- $(probe "$base/health")
            health_code="${1:-000}"
            echo "GET /health              -> http ${health_code} in ${2:-?}s (attempt ${attempt})"
            if [ "$health_code" = "200" ]; then
              break
            fi
          done

          # 2) once per run: touch the database so the free Supabase project stays active.
          set -- $(probe "$base/api/knowledge/stats")
          stats_code="${1:-000}"
          echo "GET /api/knowledge/stats -> http ${stats_code} in ${2:-?}s"

          if [ "$health_code" != "200" ] || [ "$stats_code" != "200" ]; then
            echo "Backend not fully healthy this round (health=${health_code}, stats=${stats_code})."
            echo "Not failing the workflow: a free instance may still be waking up."
          fi
          exit 0
